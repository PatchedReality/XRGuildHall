server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name _;

    root /home/exedev/xr-library-release;
    index index.html;
    autoindex off;
    server_tokens off;

    types { model/gltf-binary glb; }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location ~ (^|/)\. { return 404; }

    # Both edition indexes internally redirect to their own index.html.
    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    # Fixed-name models (including legacy root models) must revalidate.
    location ~ \.glb$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~ ^/(?:v[23]/)?assets/[^/]+-[A-Za-z0-9_-]+\.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
